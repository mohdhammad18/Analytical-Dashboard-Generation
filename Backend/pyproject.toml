[project]
name = "fastapi-backend"
version = "0.1.0"
description = "A professional FastAPI backend structure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "supabase>=2.28.2",
    # text-to-sql agent dependencies
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "pandas>=3.0.1",
    "psycopg2-binary>=2.9.11",
    "openai>=2.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "httpx",
    "ruff",
]
